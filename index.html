<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Diagnostic widget - col1</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  body { font-family: sans-serif; padding: 10px; font-size: 14px; }
  #status { padding: 8px; margin-bottom: 10px; border-radius: 4px; background: #eef; }
  ul { padding-left: 20px; }
  .event { color: #888; font-size: 11px; }
</style>
</head>
<body>
<h3>Diagnostic - table_mere / col1</h3>
<div id="status">Initialisation...</div>
<div><strong>Nombre de lignes reçues :</strong> <span id="count">-</span></div>
<ul id="list"></ul>
<h4>Journal des événements</h4>
<div id="log"></div>

<script>
let n = 0;
function log(msg) {
  n++;
  const div = document.createElement('div');
  div.className = 'event';
  div.textContent = `#${n} [${new Date().toLocaleTimeString()}] ${msg}`;
  document.getElementById('log').prepend(div);
}

grist.ready({
  requiredAccess: 'read table',
  columns: [
    { name: "col1", title: "Colonne col1", optional: false }
  ]
});

grist.onRecords((records, mappings) => {
  log(`onRecords -> ${records.length} ligne(s) reçue(s)`);
  document.getElementById('status').textContent = 'Connecté - en écoute';
  document.getElementById('count').textContent = records.length;

  const list = document.getElementById('list');
  list.innerHTML = '';
  records.forEach(r => {
    const val = mappings ? r[mappings.col1] : r.col1;
    const li = document.createElement('li');
    li.textContent = val;
    list.appendChild(li);
  });
});

grist.onOptions(() => log('onOptions déclenché'));
</script>
</body>
</html>
