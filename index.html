<script>
const listEl = document.getElementById('list');
const statusEl = document.getElementById('status');

grist.ready({
  requiredAccess: 'read table',
  columns: [
    {
      name: "ColAicher",
      title: "Colonne à afficher",
      type: "Text"
    }
  ]
});

function afficherDonnees(records) {

  console.log("================================");
  console.log("Mise à jour détectée");
  console.log("Nombre de lignes :", records.length);

  listEl.innerHTML = "";

  const mappedRecords = grist.mapColumnNames(records);

  if (!mappedRecords || mappedRecords.length === 0) {

    statusEl.textContent = "Aucune donnée visible";

    return;
  }

  statusEl.textContent =
    `${mappedRecords.length} ligne(s) visible(s)`;

  mappedRecords.forEach(rec => {

    const li = document.createElement("li");

    li.textContent = rec.ColAicher || "(Vide)";

    listEl.appendChild(li);
  });
}

grist.onRecords((records) => {

  console.log("onRecords déclenché");

  afficherDonnees(records);
});

grist.onRecord((record) => {

  console.log("onRecord déclenché");
  console.log(record);
});
</script>
