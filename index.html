<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>

<pre id="log"></pre>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>
console.log("=====================================OGL 11h00 =================================================")
const log = document.getElementById("log");

function write(msg) {
  console.log(msg);
  log.textContent += msg + "\n";
}

grist.ready({
  requiredAccess: "full"
});

async function diagnostic() {

  write("====================================================");
  write("DEBUT TEST");
  write("====================================================");

  try {

    // ------------------------------------------------
    // TABLE COMPLETE
    // ------------------------------------------------

    write("");
    write("TABLE COMPLETE (fetchTable)");
    write("--------------------------------");

    const tableComplete =
      await grist.docApi.fetchTable("Table_mere");

    write(JSON.stringify(tableComplete, null, 2));

    // ------------------------------------------------
    // TABLE SELECTIONNEE
    // ------------------------------------------------

    write("");
    write("TABLE SELECTIONNEE (fetchSelectedTable)");
    write("--------------------------------");

    const tableSelectionnee =
      await grist.docApi.fetchSelectedTable();

    write(JSON.stringify(tableSelectionnee, null, 2));

    // ------------------------------------------------
    // ENREGISTREMENT SELECTIONNE
    // ------------------------------------------------

    write("");
    write("ENREGISTREMENT SELECTIONNE");
    write("--------------------------------");

    const record =
      await grist.docApi.fetchSelectedRecord();

    write(JSON.stringify(record, null, 2));

  }
  catch(e) {

    write("");
    write("ERREUR");
    write("--------------------------------");
    write(e.toString());

  }

  write("");
  write("====================================================");
  write("FIN TEST");
  write("====================================================");

}

diagnostic();
</script>

</body>
</html>
