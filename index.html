<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>

<h3>Test événements Grist</h3>

<pre id="log"></pre>

<script>

const log = document.getElementById("log");

function write(msg) {
  console.log(msg);
  log.textContent += msg + "\n";
}

write("====================================================");
write("ATTENTE EVENEMENTS");
write("====================================================");

grist.ready({
  requiredAccess: "read table"
});


// ====================================================
// EVENEMENT SUR LES LIGNES
// ====================================================

grist.onRecords(function(records) {

  write("");
  write("=== onRecords DECLENCHE ===");

  write("Nombre de lignes : " + records.length);

  write(JSON.stringify(records, null, 2));

});


// ====================================================
// EVENEMENT SUR UNE LIGNE
// ====================================================

grist.onRecord(function(record) {

  write("");
  write("=== onRecord DECLENCHE ===");

  write(JSON.stringify(record, null, 2));

});

</script>

</body>
</html>
