<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>

<pre id="log"></pre>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<script>

const log = document.getElementById("log");

function write(msg) {
  console.log(msg);
  log.textContent += msg + "\n";
}

write("====================================================");
write("ATTENTE EVENEMENTS GRIST");
write("====================================================");

grist.ready({
  requiredAccess: "read table"
});


// --------------------------------------------------
// Quand les lignes visibles changent
// --------------------------------------------------

grist.onRecords(function(records) {

  write("");
  write("=== onRecords ===");

  write("Nombre de lignes : " + records.length);

  write(JSON.stringify(records, null, 2));

});


// --------------------------------------------------
// Quand une ligne est sélectionnée
// --------------------------------------------------

grist.onRecord(function(record) {

  write("");
  write("=== onRecord ===");

  write(JSON.stringify(record, null, 2));

});
</script>

</body>
</html>
