<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>

<pre id="log"></pre>

<script>
console.log("===================================== OGL - 07:45);
            
const log = document.getElementById("log");

function write(msg)
{
  console.log(msg);
  log.textContent += msg + "\n";
}

grist.ready({
  requiredAccess: 'read table'
});

async function test()
{
  try
  {
    const table = await grist.docApi.fetchSelectedTable();

    write("TABLE RECUPEREE");

    write(JSON.stringify(table, null, 2));
  }
  catch(e)
  {
    write("ERREUR");

    write(e.toString());
  }
}

test();

</script>

</body>
</html>
