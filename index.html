<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Diagnostic tables Grist</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  body { font-family: monospace; font-size: 13px; padding: 14px; background: #f9f9f9; }
  h3 { font-family: sans-serif; font-size: 15px; margin-bottom: 12px; }
  .block { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .ok  { color: #15803d; }
  .err { color: #b91c1c; }
  .info { color: #1d4ed8; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; margin: 4px 0 0; }
  button { padding: 6px 14px; border: 1px solid #ccc; border-radius: 5px; background: #fff; cursor: pointer; font-size: 12px; margin: 4px 4px 4px 0; }
  button:hover { background: #f0f0f0; }
  #log { max-height: 60vh; overflow-y: auto; }
</style>
</head>
<body>
<h3>Diagnostic — API interne Grist</h3>

<div class="block">
  <strong>Test 1 — grist.docApi.fetchTable avec différents noms</strong><br>
  <input type="text" id="table-input" placeholder="nom de table à tester" style="padding:5px;border:1px solid #ccc;border-radius:4px;width:220px;margin:6px 0;">
  <button onclick="testFetchTable()">Tester fetchTable</button>
  <button onclick="testFetchTableList()">Lister toutes les tables (listTables)</button>
  <button onclick="testGetDocInfo()">getDocInfo</button>
  <button onclick="testOnRecords()">Inspecter onRecords</button>
</div>

<div id="log"></div>

<script>
function log(title, content, type) {
  const div = document.createElement('div');
  div.className = 'block';
  div.innerHTML = `<strong class="${type||''}">${title}</strong><pre>${
    typeof content === 'string' ? content : JSON.stringify(content, null, 2)
  }</pre>`;
  document.getElementById('log').prepend(div);
}

grist.ready({ requiredAccess: 'read table' });

async function testFetchTable() {
  const name = document.getElementById('table-input').value.trim();
  if (!name) { alert('Saisissez un nom de table'); return; }
  log(`fetchTable("${name}") → en cours...`, '', 'info');
  try {
    const data = await grist.docApi.fetchTable(name);
    const cols = Object.keys(data);
    const nbRows = (data.id || []).length;
    log(`fetchTable("${name}") ✔ OK`, `${nbRows} ligne(s) — colonnes : ${cols.join(', ')}`, 'ok');
  } catch(e) {
    log(`fetchTable("${name}") ✘ ERREUR`, e.message, 'err');
  }
}

async function testFetchTableList() {
  log('listTables → en cours...', '', 'info');
  try {
    const tables = await grist.docApi.listTables();
    log('listTables ✔ OK', tables, 'ok');
  } catch(e) {
    log('listTables ✘ ERREUR', e.message, 'err');

    log('Tentative via fetchTable("_grist_Tables")...', '', 'info');
    try {
      const meta = await grist.docApi.fetchTable('_grist_Tables');
      log('_grist_Tables ✔ OK', meta, 'ok');
    } catch(e2) {
      log('_grist_Tables ✘ ERREUR', e2.message, 'err');
    }
  }
}

async function testGetDocInfo() {
  log('getDocInfo → en cours...', '', 'info');
  try {
    const info = await grist.docApi.getDocInfo();
    log('getDocInfo ✔ OK', info, 'ok');
  } catch(e) {
    log('getDocInfo ✘ ERREUR', e.message, 'err');
  }
}

grist.onRecords((records, mappings) => {
  log('onRecords reçu', {
    nbLignes: records.length,
    mappings: mappings,
    premiereCleDeLigne: records.length > 0 ? Object.keys(records[0]) : [],
    exempleRow: records.length > 0 ? records[0] : null
  }, 'ok');
});

function testOnRecords() {
  log('onRecords — en attente du prochain événement Grist...', 'Navigue dans la vue principale pour déclencher onRecords', 'info');
}
</script>
</body>
</html>
