<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>

<pre id="log"></pre>

<script>

const log = document.getElementById("log");

function write(msg) {
  console.log(msg);
  log.textContent += msg + "\n";
}

grist.ready({
  requiredAccess: "full"
});

(async () => {

  write("API disponibles :");

  write("grist.docApi = " + typeof grist.docApi);

  if (grist.docApi) {

    write("fetchTable = " + typeof grist.docApi.fetchTable);

    try {

      const data = await grist.docApi.fetchTable("Table_mere");

      write("Lecture Table_mere OK");

      write("Nb lignes : " + data.id.length);

    } catch(e) {

      write("Erreur Table_mere");

      write(e.toString());

    }

  }

})();
</script>

</body>
</html>
