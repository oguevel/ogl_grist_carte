<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Diagnostic v2 - onRecord + fetchSelectedTable</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  body { font-family: sans-serif; padding: 10px; font-size: 14px; }
  #status { padding: 8px; margin-bottom: 10px; border-radius: 4px; background: #eef; }
  ul { padding-left: 20px; }
  .event { color: #555; font-size: 11px; border-bottom: 1px solid #eee; padding: 2px 0; }
  .ok { color: green; }
  .err { color: red; }
</style>
</head>
<body>
<h3>Diagnostic v2</h3>
<div id="status">Initialisation...</div>
<div><strong>Ligne curseur active :</strong> <span id="cursor">-</span></div>
<div><strong>Lignes reçues via onRecords :</strong> <span id="count-records">-</span></div>
<div><strong>Lignes reçues via fetchSelectedTable :</strong> <span id="count-fetch">-</span></div>
<h4>Valeurs col1 (fetchSelectedTable)</h4>
<ul id="list"></ul>
<h4>Journal des événements</h4>
<div id="log"></div>

<script>
let n = 0;
function log(msg, type = '') {
  n++;
  const div = document.createElement('div');
  div.className = 'event ' + type;
  div.textContent = `#${n} [${new Date().toLocaleTimeString()}] ${msg}`;
  document.getElementById('log').prepend(div);
}

async function fetchAndDisplay() {
  try {
    const table = await grist.docApi.fetchSelectedTable();
    log(`fetchSelectedTable -> ${table.id ? table.id.length : '?'} ligne(s)`, 'ok');

    const ids = table.id || [];
    const col1Values = table.col1 || [];

    document.getElementById('count-fetch').textContent = ids.length;

    const list = document.getElementById('list');
    list.innerHTML = '';
    col1Values.forEach(val => {
      const li = document.createElement('li');
      li.textContent = val;
      list.appendChild(li);
    });
  } catch(e) {
    log(`fetchSelectedTable ERREUR : ${e.message}`, 'err');
  }
}

grist.ready({
  requiredAccess: 'read table',
  columns: [
    { name: "col1", title: "Colonne col1", optional: false }
  ]
});

// Événement 1 : toutes les lignes (sans filtre)
grist.onRecords((records) => {
  log(`onRecords -> ${records.length} ligne(s)`);
  document.getElementById('count-records').textContent = records.length;
  document.getElementById('status').textContent = 'Connecté';
});

// Événement 2 : ligne sélectionnée (curseur)
grist.onRecord((record) => {
  if (!record) return;
  log(`onRecord -> curseur sur id=${record.id}, col1="${record.col1}"`);
  document.getElementById('cursor').textContent = `id=${record.id}`;
  // À chaque changement de curseur, on refetch
  fetchAndDisplay();
});
</script>
</body>
</html>
