<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>

<pre id="log"></pre>

<script>
console.log("=====================================OGL 10:44 =================================================")
const log = document.getElementById("log");

function write(msg) {
  console.log(msg);
  log.textContent += msg + "\n";
}

grist.ready({
  requiredAccess: "full"
});

(async function() {

  write("=== DEBUT ===");

  try {

    const tables = await grist.docApi.listTables();

    write("TABLES DISPONIBLES :");

    tables.forEach(t => write(t));

  }
  catch(e) {

    write("ERREUR listTables");
    write(e.toString());

  }

  try {

    write("");
    write("Lecture _grist_Filters");

    const filters =
      await grist.docApi.fetchTable("_grist_Filters");

    write("OK");

    write(JSON.stringify(filters, null, 2));

  }
  catch(e) {

    write("ERREUR _grist_Filters");
    write(e.toString());

  }

  try {

    write("");
    write("Lecture _grist_Views");

    const views =
      await grist.docApi.fetchTable("_grist_Views");

    write("OK");

    write(JSON.stringify(views, null, 2));

  }
  catch(e) {

    write("ERREUR _grist_Views");
    write(e.toString());

  }

})();

</script>

</body>
</html>
