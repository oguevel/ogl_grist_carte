<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    body { font-family: sans-serif; font-size: 13px; line-height: 1.4; }
    .status-ok { color: green; font-weight: bold; }
    .status-error { color: red; font-weight: bold; }
    .version-tag { background: #eee; padding: 2px 5px; border-radius: 3px; font-family: monospace; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    .category { background: #e9ecef; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Vérification de l'API Grist</h3>
  <p><strong>Version API REST :</strong> <span class="version-tag">1.0.1</span></p>
  
  <table id="results">
    <thead>
      <tr>
        <th>Interface / Fonction</th>
        <th>Rôle</th>
        <th>Résultat</th>
      </tr>
    </thead>
    <tbody id="body"></tbody>
  </table>

  <script>
    const tests = [
      { cat: "Noyau Plugin", name: "grist.ready()", role: "Initialisation du widget", test: () => true },
      { cat: "Noyau Plugin", name: "grist.onRecords", role: "Écoute des données filtrées", test: (data) => !!data },
      { cat: "API Document", name: "grist.docApi.getDocMeta()", role: "Lecture des métadonnées du document", test: async () => await grist.docApi.getDocMeta() },
      { cat: "API Document", name: "grist.docApi.listTables()", role: "Énumération des tables du document", test: async () => await grist.docApi.listTables() },
      { cat: "API Vue", name: "grist.selectedTable", role: "Interaction avec la table active", test: () => !!grist.selectedTable },
      { cat: "API CRUD", name: "TableOperations.update", role: "Modification de données (Accès complet requis)", test: async () => {
          if (!grist.selectedTable) throw new Error("Table non sélectionnée");
          return "Prêt";
      }}
    ];

    async function runTests(records) {
      const tbody = document.getElementById('body');
      tbody.innerHTML = '';
      let lastCat = '';

      for (const t of tests) {
        if (t.cat !== lastCat) {
          const catRow = tbody.insertRow();
          catRow.className = 'category';
          catRow.innerHTML = `<td colspan="3">${t.cat}</td>`;
          lastCat = t.cat;
        }

        const row = tbody.insertRow();
        row.insertCell(0).textContent = t.name;
        row.insertCell(1).textContent = t.role;
        const resCell = row.insertCell(2);

        try {
          const result = await t.test(records);
          resCell.innerHTML = '<span class="status-ok">✓ Fonctionnelle</span>';
        } catch (e) {
          resCell.innerHTML = `<span class="status-error">✗ Erreur / Non autorisé</span><br><small>${e.message}</small>`;
        }
      }
    }

    // Lancement de l'API
    grist.ready({ requiredAccess: 'full' });
    grist.onRecords((records) => {
      runTests(records);
    });
  </script>
</body>
</html>
