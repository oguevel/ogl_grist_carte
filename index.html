<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>

<pre id="log"></pre>

<script>

const log = document.getElementById("log");

function write(msg) {
  console.log(msg);
  log.textContent += msg + "\n";
}

grist.ready({
  requiredAccess: 'read table'
});

write("Version diagnostic");

write("docApi = " + typeof grist.docApi);

if (grist.docApi) {

  write("Méthodes disponibles :");

  for (const k in grist.docApi) {
    write(k);
  }

}

</script>

</body>
</html>
