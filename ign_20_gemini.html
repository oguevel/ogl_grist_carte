<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Widget Cartographique IGN - Grist</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #top-bar {
            padding: 10px;
            background: #f8f9fa;
            border-bottom: 1px solid #ccc;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        .filter-group label {
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #333;
            text-transform: uppercase;
        }
        select[multiple] {
            height: 70px;
            min-width: 160px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #btn-update {
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            height: 35px;
            font-weight: bold;
            border: none;
            background-color: #28a745;
            color: white;
        }
        #btn-update:hover { 
            background-color: #218838; 
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        .info-popup { 
            font-size: 13px; 
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="filter-group">
            <label for="filter-region">Régions</label>
            <select id="filter-region" multiple></select>
        </div>
        <div class="filter-group">
            <label for="filter-dept">Départements</label>
            <select id="filter-dept" multiple></select>
        </div>
        
        <div id="dynamic-filters" style="display: flex; gap: 15px; flex-wrap: wrap;"></div>
        
        <button id="btn-update">Mettre à jour la carte</button>
    </div>

    <div id="map"></div>

<script>
    // --- Variables globales ---
    let map;
    let mappedRecords = [];    // Contiendra les enregistrements convertis avec les clés configurées
    let currentConfig = {};    // Stockage de la configuration des colonnes et options
    let markersLayer;          // Couche Leaflet pour les marqueurs (épingles)
    let geojsonLayer;          // Couche Leaflet pour les polygones des départements
    let geojsonFranceData = null; 

    // Initialisation de la carte Leaflet (centrée sur la France par défaut, sans données)
    function initMap() {
        map = L.map('map').setView([46.603354, 1.888334], 6);
        
        // Appel aux tuiles du Plan IGN de la Géoplateforme
        L.tileLayer('https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
            attribution: '&copy; <a href="https://www.ign.fr/">IGN</a>',
            maxZoom: 18
        }).addTo(map);

        markersLayer = L.layerGroup().addTo(map);
        geojsonLayer = L.layerGroup().addTo(map);
    }

    // Chargement asynchrone des contours GeoJSON des départements français
    async function loadDeptGeoJSON() {
        try {
            const response = await fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements.geojson');
            geojsonFranceData = await response.json();
        } catch (err) {
            console.error("Erreur lors du chargement des contours de départements :", err);
        }
    }

    // Générateur de couleurs de fond pastel aléatoires pour les départements
    function getPastelColor() {
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue}, 75%, 85%)`;
    }

    // Convertit une chaîne de caractères séparée par des virgules en tableau nettoyé
    function parseList(str) {
        if (!str) return [];
        return str.split(',').map(s => s.trim()).filter(s => s.length > 0);
    }

    // --- Remplissage des options dans les listes déroulantes (Filtres Croisés) ---
    function populateFilters(dataToUse = mappedRecords, changedFilterId = null) {
        // Extraction des valeurs uniques disponibles pour les Régions et Départements
        const regions = [...new Set(dataToUse.map(r => r.colRegion))].filter(Boolean).sort();
        const depts = [...new Set(dataToUse.map(r => r.colDept))].filter(Boolean).sort();

        updateSelectOptions('filter-region', regions, changedFilterId !== 'filter-region');
        updateSelectOptions('filter-dept', depts, changedFilterId !== 'filter-dept');

        // Traitement des n filtres additionnels configurés par l'utilisateur
        const customFilterNames = parseList(currentConfig.filterVariables);
        customFilterNames.forEach(colName => {
            const selectId = `filter-custom-${colName}`;
            // On cherche la valeur de la colonne additionnelle stockée dans l'objet "customFields" du record
            const vals = [...new Set(dataToUse.map(r => r.customFields ? r.customFields[colName] : null))].filter(Boolean).sort();
            updateSelectOptions(selectId, vals, changedFilterId !== selectId);
        });
    }

    // Met à jour le DOM d'un élément select sans perdre la sélection utilisateur active
    function updateSelectOptions(selectId, values, repaint) {
        const select = document.getElementById(selectId);
        if (!select || !repaint) return;

        const selectedValues = Array.from(select.selectedOptions).map(opt => opt.value);
        select.innerHTML = '';
        
        values.forEach(val => {
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            if (selectedValues.includes(String(val))) opt.selected = true;
            select.appendChild(opt);
        });
    }

    // Déclenché dès qu'un utilisateur change un choix dans l'un des filtres multi-sélections
    function onFilterChange(e) {
        let filtered = [...mappedRecords];

        // Application en cascade de l'ensemble des filtres
        filtered = applyFilterSelection(filtered, 'filter-region', 'colRegion', false);
        filtered = applyFilterSelection(filtered, 'filter-dept', 'colDept', false);
        
        const customFilterNames = parseList(currentConfig.filterVariables);
        customFilterNames.forEach(colName => {
            filtered = applyFilterSelection(filtered, `filter-custom-${colName}`, colName, true);
        });

        // Met à jour dynamiquement les options restantes des autres filtres
        populateFilters(filtered, e.target.id);
    }

    // Filtre le tableau de données selon les éléments sélectionnés dans le composant HTML
    function applyFilterSelection(data, selectId, keyName, isCustomField) {
        const select = document.getElementById(selectId);
        if (!select) return data;
        const selected = Array.from(select.selectedOptions).map(opt => opt.value);
        if (selected.length === 0) return data; // Pas de sélection = pas de restriction appliquée
        
        return data.filter(r => {
            const valueToCompare = isCustomField ? (r.customFields ? r.customFields[keyName] : null) : r[keyName];
            return selected.includes(String(valueToCompare));
        });
    }

    // --- Actionneur principal : Dessin et Recentrage de la Carte ---
    function updateMap() {
        // Nettoyage complet des anciennes données visuelles
        markersLayer.clearLayers();
        geojsonLayer.clearLayers();

        // Récupération et filtrage final des données à afficher
        let dataToShow = [...mappedRecords];
        dataToShow = applyFilterSelection(dataToShow, 'filter-region', 'colRegion', false);
        dataToShow = applyFilterSelection(dataToShow, 'filter-dept', 'colDept', false);
        
        const customFilterNames = parseList(currentConfig.filterVariables);
        customFilterNames.forEach(colName => {
            dataToShow = applyFilterSelection(dataToShow, `filter-custom-${colName}`, colName, true);
        });

        if (dataToShow.length === 0) {
            alert("Aucune donnée ne correspond aux critères sélectionnés.");
            return;
        }

        const bounds = L.latLngBounds();
        const activeDepts = new Set();

        // 1. Placement des épingles (Marqueurs)
        dataToShow.forEach(record => {
            const latLngStr = record.colLatLng;
            if (!latLngStr) return;

            const parts = latLngStr.split(',');
            if (parts.length !== 2) return;
            
            const lat = parseFloat(parts[0].trim());
            const lng = parseFloat(parts[1].trim());

            if (!isNaN(lat) && !isNaN(lng)) {
                const latLng = [lat, lng];
                bounds.extend(latLng);

                // Construction dynamique du cartouche d'information
                let popupContent = `<div class="info-popup"><strong>${record.colTitle || 'Sans titre'}</strong><br><hr>`;
                const displayVars = parseList(currentConfig.displayVariables);
                displayVars.forEach(v => {
                    if (record.customFields && record.customFields[v] !== undefined) {
                        popupContent += `<b>${v} :</b> ${record.customFields[v]}<br>`;
                    }
                });
                popupContent += `</div>`;

                L.marker(latLng).bindPopup(popupContent).addTo(markersLayer);

                // Collecte des départements visibles pour dessiner les contours
                if (record.colDept) {
                    activeDepts.add(String(record.colDept).trim());
                }
            }
        });

        // 2. Dessin des polygones de contours des départements ciblés
        if (geojsonFranceData && activeDepts.size > 0) {
            const filteredGeoJSON = {
                type: "FeatureCollection",
                features: geojsonFranceData.features.filter(f => {
                    return activeDepts.has(f.properties.nom) || activeDepts.has(f.properties.code);
                })
            };

            L.geoJSON(filteredGeoJSON, {
                style: function() {
                    return {
                        fillColor: getPastelColor(),
                        weight: 1.5,
                        opacity: 1,
                        color: '#555',
                        fillOpacity: 0.55
                    };
                }
            }).addTo(geojsonLayer);
        }

        // 3. Zoom automatique et recentrage de la carte sur l'emprise des marqueurs
        if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [40, 40] });
        }
    }

    // --- Génération dynamique de l'interface pour les N filtres supplémentaires ---
    function setupDynamicFilterDOM() {
        const container = document.getElementById('dynamic-filters');
        container.innerHTML = '';
        const customFilterNames = parseList(currentConfig.filterVariables);

        customFilterNames.forEach(colName => {
            const group = document.createElement('div');
            group.className = 'filter-group';
            
            const label = document.createElement('label');
            label.textContent = colName;
            
            const select = document.createElement('select');
            select.id = `filter-custom-${colName}`;
            select.multiple = true;
            select.addEventListener('change', onFilterChange);

            group.appendChild(label);
            group.appendChild(select);
            container.appendChild(group);
        });
    }

    // --- Configuration de l'API de section personnalisée Grist ---
    grist.ready({
        requiredAccess: 'read table',
        columns: [
            { name: "colLatLng", title: "Latitude, Longitude", type: "Text" },
            { name: "colTitle", title: "Titre Épingle", type: "Text" },
            { name: "colRegion", title: "Colonne Région", type: "Text" },
            { name: "colDept", title: "Colonne Département", type: "Text" }
        ],
        options: {
            displayVariables: { type: "String", title: "Variables cartouche (séparées par des ,)", optional: true },
            filterVariables: { type: "String", title: "Filtres additionnels (séparés par des ,)", optional: true }
        }
    });

    // Réception et traitement sécurisé des enregistrements Grist
    grist.onRecords((records, mappings) => {
        if (!mappings) return; // En attente du mapping complet initial

        currentConfig = grist.getOptions() || {};
        
        const customFilterNames = parseList(currentConfig.filterVariables);
        const displayVars = parseList(currentConfig.displayVariables);

        // Reconstruction saine du tableau d'objets sans passer par la fonction défaillante mapRecords
        mappedRecords = records.map(rec => {
            const obj = {
                colLatLng: rec[mappings.colLatLng] || null,
                colTitle: rec[mappings.colTitle] || null,
                colRegion: rec[mappings.colRegion] || null,
                colDept: rec[mappings.colDept] || null,
                customFields: {}
            };
            
            // Extraction dynamique des colonnes variables demandées par l'utilisateur
            customFilterNames.forEach(col => { obj.customFields[col] = rec[col] || null; });
            displayVars.forEach(col => { obj.customFields[col] = rec[col] || null; });
            
            return obj;
        });

        // Regénération de l'affichage de l'interface
        setupDynamicFilterDOM();
        populateFilters();
    });

    // Initialisation au cycle de vie de la page de l'iframe
    window.addEventListener('DOMContentLoaded', async () => {
        initMap();
        await loadDeptGeoJSON();

        // Enregistrement des écouteurs d'événements de base
        document.getElementById('filter-region').addEventListener('change', onFilterChange);
        document.getElementById('filter-dept').addEventListener('change', onFilterChange);
        document.getElementById('btn-update').addEventListener('click', updateMap);
    });
</script>
</body>
</html>
