<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Widget Cartographique IGN pour Grist</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #controls {
            padding: 10px;
            background: #f8f9fa;
            border-bottom: 1px solid #ccc;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-end;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        .filter-group label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        select[multiple] {
            height: 60px;
            min-width: 150px;
        }
        #btn-update {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            height: 35px;
        }
        #btn-update:hover {
            background-color: #0056b3;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        .info-popup {
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="filter-group">
            <label for="filter-region">Régions</label>
            <select id="filter-region" multiple></select>
        </div>
        <div class="filter-group">
            <label for="filter-dept">Départements</label>
            <select id="filter-dept" multiple></select>
        </div>
        <div id="dynamic-filters" style="display: flex; gap: 10px;"></div>
        
        <button id="btn-update">Mettre à jour la carte</button>
    </div>

    <div id="map"></div>

<script>
    // --- Initialisation des variables globales ---
    let map;
    let allRecords = [];       // Stocke l'ensemble des données Grist
    let config = {};           // Stocke la configuration du Widget
    let markersLayer;          // Groupe Leaflet pour les épingles
    let geojsonLayer;          // Groupe Leaflet pour les contours de départements
    let geojsonFranceData = null; // Stockera le fond de carte des départements Français

    // Initialisation de la carte Leaflet centrée sur la France au démarrage (sans données)
    function initMap() {
        map = L.map('map').setView([46.603354, 1.888334], 6);
        
        // Fond de carte IGN (Plan IGN standard via la Géoplateforme)
        L.tileLayer('https://data.geopf.fr/wmts?REQUEST=GetTile&SERVICE=WMTS&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {
            attribution: '&copy; <a href="https://www.ign.fr/">IGN</a>',
            maxZoom: 18
        }).addTo(map);

        markersLayer = L.layerGroup().addTo(map);
        geojsonLayer = L.layerGroup().addTo(map);
    }

    // Charger les contours de départements (GeoJSON simplifié pour les performances)
    // On utilise une API publique ouverte pour récupérer les contours
    async function loadDeptGeoJSON() {
        try {
            const response = await fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements.geojson');
            geojsonFranceData = await response.json();
        } catch (err) {
            console.error("Erreur lors du chargement des contours de départements :", err);
        }
    }

    // --- Générateur de couleur pastel ---
    function getPastelColor() {
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue}, 70%, 80%)`;
    }

    // --- Gestion de la cascade de Filtres ---
    function populateFilters(dataToUse = allRecords, changedFilterId = null) {
        if (!config.colRegion || !config.colDept) return;

        // Si aucun filtre n'est manipulé, on initialise tout à partir de toutes les données
        const regions = [...new Set(dataToUse.map(r => r[config.colRegion]))].filter(Boolean).sort();
        const depts = [...new Set(dataToUse.map(r => r[config.colDept]))].filter(Boolean).sort();

        updateSelectOptions('filter-region', regions, changedFilterId !== 'filter-region');
        updateSelectOptions('filter-dept', depts, changedFilterId !== 'filter-dept');

        // Gestion des variables de filtrage additionnelles de l'utilisateur
        if (config.filterVariables) {
            config.filterVariables.forEach(varName => {
                const selectId = `filter-custom-${varName}`;
                const vals = [...new Set(dataToUse.map(r => r[varName]))].filter(Boolean).sort();
                updateSelectOptions(selectId, vals, changedFilterId !== selectId);
            });
        }
    }

    function updateSelectOptions(selectId, values, repaint) {
        const select = document.getElementById(selectId);
        if (!select || !repaint) return;

        // Sauvegarde des valeurs précédemment sélectionnées
        const selectedValues = Array.from(select.selectedOptions).map(opt => opt.value);
        
        select.innerHTML = '';
        values.forEach(val => {
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            if (selectedValues.includes(val)) opt.selected = true;
            document.getElementById(selectId).appendChild(opt);
        });
    }

    // Déclenché quand l'utilisateur change une option dans un filtre
    function onFilterChange(e) {
        // Recalculer l'état des filtres croisés
        let filtered = [...allRecords];

        // Appliquer successivement les filtres actifs pour restreindre les choix des autres sélecteurs
        filtered = applyFilterSelection(filtered, 'filter-region', config.colRegion);
        filtered = applyFilterSelection(filtered, 'filter-dept', config.colDept);
        
        if (config.filterVariables) {
            config.filterVariables.forEach(varName => {
                filtered = applyFilterSelection(filtered, `filter-custom-${varName}`, varName);
            });
        }

        // Mettre à jour les listes déroulantes des autres filtres
        populateFilters(filtered, e.target.id);
    }

    function applyFilterSelection(data, selectId, colName) {
        const select = document.getElementById(selectId);
        if (!select) return data;
        const selected = Array.from(select.selectedOptions).map(opt => opt.value);
        if (selected.length === 0) return data; // Pas de sélection = pas de filtre appliqué
        return data.filter(r => selected.includes(String(r[colName])));
    }

    // --- Mise à jour de la carte au clic sur le bouton ---
    function updateMap() {
        // Nettoyage des couches précédentes
        markersLayer.clearLayers();
        geojsonLayer.clearLayers();

        // Application finale des filtres pour l'affichage
        let dataToShow = [...allRecords];
        dataToShow = applyFilterSelection(dataToShow, 'filter-region', config.colRegion);
        dataToShow = applyFilterSelection(dataToShow, 'filter-dept', config.colDept);
        if (config.filterVariables) {
            config.filterVariables.forEach(varName => {
                dataToShow = applyFilterSelection(dataToShow, `filter-custom-${varName}`, varName);
            });
        }

        if (dataToShow.length === 0) {
            alert("Aucune donnée ne correspond à ces critères.");
            return;
        }

        const bounds = L.latLngBounds();
        const activeDepts = new Set();

        // 1. Placement des épingles (Markers)
        dataToShow.forEach(record => {
            const latLngStr = record[config.colLatLng];
            if (!latLngStr) return;

            const [lat, lng] = latLngStr.split(',').map(coord => parseFloat(coord.trim()));
            if (isNaN(lat) || !isNaN(lng)) {
                const latLng = [lat, lng];
                bounds.extend(latLng);

                // Construction du cartouche (Popup) avec les variables choisies
                let popupContent = `<div class="info-popup"><strong>${record[config.colTitle] || 'Sans titre'}</strong><br><hr>`;
                if (config.displayVariables) {
                    config.displayVariables.forEach(v => {
                        popupContent += `<b>${v} :</b> ${record[v] || ''}<br>`;
                    });
                }
                popupContent += `</div>`;

                L.marker(latLng).bindPopup(popupContent).addTo(markersLayer);

                // Collecter le nom du département pour dessiner les contours
                if (record[config.colDept]) {
                    activeDepts.add(String(record[config.colDept]).trim());
                }
            }
        });

        // 2. Dessin des contours de départements concernés
        if (geojsonFranceData && activeDepts.size > 0) {
            const filteredGeoJSON = {
                type: "FeatureCollection",
                features: geojsonFranceData.features.filter(f => {
                    // Vérification par nom ou par code (gère la correspondance souple)
                    return activeDepts.has(f.properties.nom) || activeDepts.has(f.properties.code);
                })
            };

            L.geoJSON(filteredGeoJSON, {
                style: function() {
                    return {
                        fillColor: getPastelColor(),
                        weight: 2,
                        opacity: 1,
                        color: '#666',
                        fillOpacity: 0.5
                    };
                }
            }).addTo(geojsonLayer);
        }

        // 3. Recentrer la carte sur les marqueurs affichés
        if (bounds.isValid()) {
            map.fitBounds(bounds);
        }
    }

    // --- Configuration et Grist API ---
    // Génère dynamiquement l'interface HTML pour les variables de filtrage customisées
    function setupCustomFilterElements(filterVars) {
        const container = document.getElementById('dynamic-filters');
        container.innerHTML = '';
        if (!filterVars) return;

        filterVars.forEach(varName => {
            const group = document.createElement('div');
            group.className = 'filter-group';
            
            const label = document.createElement('label');
            label.textContent = varName;
            
            const select = document.createElement('select');
            select.id = `filter-custom-${varName}`;
            select.multiple = true;
            select.addEventListener('change', onFilterChange);

            group.appendChild(label);
            group.appendChild(select);
            container.appendChild(group);
        });
    }

    // Écouteur Grist pour récupérer la configuration et les données
    grist.ready({
        requiredAccess: 'read table',
        columns: [
            { name: "colLatLng", title: "Latitude, Longitude", type: "Text" },
            { name: "colTitle", title: "Titre Épingle", type: "Text" },
            { name: "colRegion", title: "Colonne Région", type: "Text" },
            { name: "colDept", title: "Colonne Département", type: "Text" }
        ],
        // Déclaration des paramètres additionnels éditables dans le volet Grist
        options: {
            displayVariables: { type: "StringList", title: "Variables du cartouche", optional: true },
            filterVariables: { type: "StringList", title: "Variables de filtre additionnelles", optional: true }
        }
    });

    // Événement déclenché à la réception de données ou modification des options
    grist.onRecords((records, mappings) => {
        // Enregistrer les données mappées
        allRecords = grist.mapRecords(records);
        
        // Récupérer la configuration actuelle sauvée dans Grist
        config = grist.getOptions() || {};
        // Fusionner les mappings de colonnes obligatoires dans l'objet de config
        Object.assign(config, mappings);

        // Initialiser les filtres customisés basés sur les options
        setupCustomFilterElements(config.filterVariables);

        // Remplir les listes de choix
        populateFilters();
    });

    // --- Initialisation au chargement de la page ---
    window.addEventListener('DOMContentLoaded', async () => {
        initMap();
        await loadDeptGeoJSON();

        // Attacher les écouteurs d'événements sur les filtres principaux
        document.getElementById('filter-region').addEventListener('change', onFilterChange);
        document.getElementById('filter-dept').addEventListener('change', onFilterChange);
        
        // Attacher l'action de mise à jour au bouton
        document.getElementById('btn-update').addEventListener('click', updateMap);
    });
</script>
</body>
</html>
