f<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Widget Cartographique IGN Vectoriel - Grist</title>
    <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f6f8;
        }
        #top-bar {
            padding: 12px 15px;
            background: #ffffff;
            border-bottom: 1px solid #e1e4e8;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            z-index: 1000;
        }
        
        /* Style des Dropdowns Personnalisés à cases à cocher */
        .multiselect-container {
            position: relative;
            display: inline-block;
        }
        .multiselect-label {
            font-size: 11px;
            font-weight: bold;
            color: #4c5765;
            text-transform: uppercase;
            margin-bottom: 3px;
            display: block;
        }
        .multiselect-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 8px 30px 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            min-width: 160px;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
            user-select: none;
        }
        .multiselect-btn:after {
            content: "▼";
            font-size: 9px;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        .multiselect-btn:hover {
            border-color: #94a3b8;
        }
        .multiselect-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 200px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 1010;
            border-radius: 6px;
            margin-top: 4px;
            padding: 6px 0;
        }
        .multiselect-content.show {
            display: block;
        }
        .multiselect-option {
            padding: 6px 12px;
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #334155;
            cursor: pointer;
        }
        .multiselect-option:hover {
            background-color: #f1f5f9;
        }
        .multiselect-option input {
            margin-right: 8px;
            cursor: pointer;
        }
        
        #btn-update {
            padding: 8px 18px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            background-color: #10b981;
            color: white;
            align-self: flex-end;
            margin-bottom: 2px;
            transition: background-color 0.2s;
            height: 36px;
        }
        #btn-update:hover { 
            background-color: #059669; 
        }
        
        #map {
            flex-grow: 1;
            width: 100%;
        }
        
        /* Style des popups MapLibre */
        .maplibregl-popup-content {
            font-size: 13px;
            line-height: 1.4;
            font-family: Arial, sans-serif;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="multiselect-container" id="container-region">
            <span class="multiselect-label">Régions</span>
            <button class="multiselect-btn" id="btn-region" onclick="toggleDropdown('content-region')">Sélectionner...</button>
            <div class="multiselect-content" id="content-region"></div>
        </div>
        
        <div class="multiselect-container" id="container-dept">
            <span class="multiselect-label">Départements</span>
            <button class="multiselect-btn" id="btn-dept" onclick="toggleDropdown('content-dept')">Sélectionner...</button>
            <div class="multiselect-content" id="content-dept"></div>
        </div>
        
        <div id="dynamic-filters" style="display: flex; gap: 12px; flex-wrap: wrap;"></div>
        
        <button id="btn-update">Mettre à jour la carte</button>
    </div>

    <div id="map"></div>

<script>
    // --- Variables globales ---
    let map;
    let mappedRecords = [];    
    let currentConfig = {};    
    let geojsonFranceData = null; 
    let currentPopup = null;

    // Initialisation de la carte MapLibre GL avec le style Vector Tiles IGN demandé
    function initMap() {
        map = new maplibregl.Map({
            container: 'map',
            style: 'https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/standard.json',
            center: [2.3522, 46.8566],
            zoom: 5,
            attributionControl: true
        });

        // Une fois le style de la carte chargé, on prépare les couches de données vides
        map.on('load', () => {
            // Source et couche pour les contours de départements
            map.addSource('depts-source', {
                type: 'geojson',
                data: { type: 'FeatureCollection', features: [] }
            });
            
            map.addLayer({
                id: 'depts-layer-fill',
                type: 'fill',
                source: 'depts-source',
                paint: {
                    // Utilise la propriété de couleur pastel générée à la volée dans le GeoJSON
                    'fill-color': ['get', 'randomPastelColor'],
                    'fill-opacity': 0.5
                }
            });

            map.addLayer({
                id: 'depts-layer-stroke',
                type: 'line',
                source: 'depts-source',
                paint: {
                    'line-color': '#64748b',
                    'line-width': 1.5
                }
            });

            // Source et couche pour les cercles blancs (10px diamètre, contour noir 1px)
            map.addSource('points-source', {
                type: 'geojson',
                data: { type: 'FeatureCollection', features: [] }
            });

            map.addLayer({
                id: 'points-layer',
                type: 'circle',
                source: 'points-source',
                paint: {
                    'circle-radius': 5, // Rayon de 5px = Diamètre de 10px
                    'circle-color': '#ffffff',
                    'circle-stroke-width': 1,
                    'circle-stroke-color': '#000000'
                }
            });

            // Gestion du clic sur les cercles pour ouvrir le cartouche d'information (Popup)
            map.on('click', 'points-layer', (e) => {
                const coordinates = e.features[0].geometry.coordinates.slice();
                const description = e.features[0].properties.popupHtml;

                if (currentPopup) currentPopup.remove();

                currentPopup = new maplibregl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(description)
                    .addTo(map);
            });

            // Changement de curseur au survol des points
            map.on('mouseenter', 'points-layer', () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'points-layer', () => { map.getCanvas().style.cursor = ''; });
        });
    }

    // Chargement asynchrone des contours GeoJSON des départements français
    async function loadDeptGeoJSON() {
        try {
            const response = await fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements.geojson');
            geojsonFranceData = await response.json();
        } catch (err) {
            console.error("Erreur lors du chargement des contours de départements :", err);
        }
    }

    // Générateur de couleurs de fond pastel aléatoires pour les départements
    function getPastelColor() {
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue}, 75%, 85%)`;
    }

    // Convertit une chaîne séparée par des virgules en tableau
    function parseList(str) {
        if (!str) return [];
        return str.split(',').map(s => s.trim()).filter(s => s.length > 0);
    }

    // Gestion de l'ouverture / fermeture des menus déroulants
    function toggleDropdown(contentId) {
        const dropdowns = document.getElementsByClassName("multiselect-content");
        for (let i = 0; i < dropdowns.length; i++) {
            if (dropdowns[i].id !== contentId) {
                dropdowns[i].classList.remove('show');
            }
        }
        document.getElementById(contentId).classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.matches('.multiselect-btn') && !event.target.closest('.multiselect-content')) {
            const dropdowns = document.getElementsByClassName("multiselect-content");
            for (let i = 0; i < dropdowns.length; i++) {
                dropdowns[i].classList.remove('show');
            }
        }
    }

    // --- Remplissage des options sous forme de cases à cocher ---
    function populateFilters(dataToUse = mappedRecords, changedFilterId = null) {
        const regions = [...new Set(dataToUse.map(r => r.colRegion))].filter(Boolean).sort();
        const depts = [...new Set(dataToUse.map(r => r.colDept))].filter(Boolean).sort();

        updateCheckboxOptions('content-region', 'btn-region', regions, changedFilterId !== 'content-region');
        updateCheckboxOptions('content-dept', 'btn-dept', depts, changedFilterId !== 'content-dept');

        const customFilterNames = parseList(currentConfig.filterVariables);
        customFilterNames.forEach(colName => {
            const contentId = `content-custom-${colName}`;
            const btnId = `btn-custom-${colName}`;
            const vals = [...new Set(dataToUse.map(r => r.customFields ? r.customFields[colName] : null))].filter(Boolean).sort();
            updateCheckboxOptions(contentId, btnId, vals, changedFilterId !== contentId);
        });
    }

    function updateCheckboxOptions(contentId, btnId, values, repaint) {
        const contentDiv = document.getElementById(contentId);
        const btn = document.getElementById(btnId);
        if (!contentDiv || !btn) return;

        const checkedValues = new Set();
        const checkboxes = contentDiv.querySelectorAll('input[type="checkbox"]:checked');
        checkboxes.forEach(cb => checkedValues.add(cb.value));

        if (repaint) {
            contentDiv.innerHTML = '';
            values.forEach(val => {
                const label = document.createElement('label');
                label.className = 'multiselect-option';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = val;
                if (checkedValues.has(String(val))) checkbox.checked = true;
                
                checkbox.addEventListener('change', () => onFilterChange(contentId));

                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(val));
                contentDiv.appendChild(label);
            });
        }

        const dynamicChecked = contentDiv.querySelectorAll('input[type="checkbox"]:checked');
        if (dynamicChecked.length === 0) {
            btn.textContent = "Sélectionner...";
        } else if (dynamicChecked.length <= 2) {
            btn.textContent = Array.from(dynamicChecked).map(cb => cb.value).join(', ');
        } else {
            btn.textContent = `${dynamicChecked.length} sélectionnés`;
        }
    }

    function onFilterChange(changedContentId) {
        let filtered = [...mappedRecords];

        filtered = applyFilterSelection(filtered, 'content-region', 'colRegion', false);
        filtered = applyFilterSelection(filtered, 'content-dept', 'colDept', false);
        
        const customFilterNames = parseList(currentConfig.filterVariables);
        customFilterNames.forEach(colName => {
            filtered = applyFilterSelection(filtered, `content-custom-${colName}`, colName, true);
        });

        populateFilters(filtered, changedContentId);
    }

    function applyFilterSelection(data, contentId, keyName, isCustomField) {
        const contentDiv = document.getElementById(contentId);
        if (!contentDiv) return data;
        
        const checkboxes = contentDiv.querySelectorAll('input[type="checkbox"]:checked');
        if (checkboxes.length === 0) return data; 
        
        const selectedValues = Array.from(checkboxes).map(cb => cb.value);
        return data.filter(r => {
            const valueToCompare = isCustomField ? (r.customFields ? r.customFields[keyName] : null) : r[keyName];
            return selectedValues.includes(String(valueToCompare));
        });
    }

    // --- Actionneur principal : Mise à jour MapLibre GL ---
    function updateMap() {
        if (!map.getSource('points-source') || !map.getSource('depts-source')) return;

        if (currentPopup) currentPopup.remove();

        let dataToShow = [...mappedRecords];
        dataToShow = applyFilterSelection(dataToShow, 'content-region', 'colRegion', false);
        dataToShow = applyFilterSelection(dataToShow, 'content-dept', 'colDept', false);
        
        const customFilterNames = parseList(currentConfig.filterVariables);
        customFilterNames.forEach(colName => {
            dataToShow = applyFilterSelection(dataToShow, `content-custom-${colName}`, colName, true);
        });

        if (dataToShow.length === 0) {
            alert("Aucune donnée ne correspond aux critères sélectionnés.");
            return;
        }

        const pointFeatures = [];
        const activeDepts = new Set();
        const bounds = new maplibregl.LngLatBounds();
        let hasValidBounds = false;

        // 1. Génération du GeoJSON pour les cercles
        dataToShow.forEach(record => {
            //ogl
            console.log("ogl");
            const latLngStr = record.colLatLng;
            if (!latLngStr) return;


            const parts = latLngStr.split(',');
            if (parts.length !== 2) return;
            
            const lat = parseFloat(parts[0].trim());
            const lng = parseFloat(parts[1].trim());

            if (!isNaN(lat) && !isNaN(lng)) {
                // ATTENTION : MapLibre prend [Longitude, Latitude] à l'inverse de Leaflet
                bounds.extend([lng, lat]);
                hasValidBounds = true;

                // Génération du contenu HTML du cartouche d'information
                let popupHtml = `<div class="info-popup"><strong>${record.colTitle || 'Sans titre'}</strong><br><hr>`;
                const displayVars = parseList(currentConfig.displayVariables);
                displayVars.forEach(v => {
                    if (record.customFields && record.customFields[v] !== undefined) {
                        popupHtml += `<b>${v} :</b> ${record.customFields[v]}<br>`;
                    }
                });
                popupHtml += `</div>`;

                pointFeatures.push({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: [lng, lat] },
                    properties: { popupHtml: popupHtml }
                });

                if (record.colDept) {
                    activeDepts.add(String(record.colDept).trim());
                }
            }
        });

        // Injection des points calculés dans la carte vectorielle
        map.getSource('points-source').setData({
            type: 'FeatureCollection',
            features: pointFeatures
        });

        // 2. Génération du GeoJSON filtré pour les contours de départements
        if (geojsonFranceData && activeDepts.size > 0) {
            const filteredFeatures = geojsonFranceData.features
                .filter(f => activeDepts.has(f.properties.nom) || activeDepts.has(f.properties.code))
                .map(f => {
                    // On attribue une couleur pastel unique stockée directement dans l'entité GeoJSON
                    f.properties.randomPastelColor = getPastelColor();
                    return f;
                });

            map.getSource('depts-source').setData({
                type: 'FeatureCollection',
                features: filteredFeatures
            });
        } else {
            map.getSource('depts-source').setData({ type: 'FeatureCollection', features: [] });
        }

        // 3. Zoom automatique et recentrage adaptatif
        if (hasValidBounds) {
            map.fitBounds(bounds, { padding: 50, maxZoom: 15 });
        }
    }

    // --- Génération de l'interface pour les N filtres supplémentaires ---
    function setupDynamicFilterDOM() {
        const container = document.getElementById('dynamic-filters');
        container.innerHTML = '';
        const customFilterNames = parseList(currentConfig.filterVariables);

        customFilterNames.forEach(colName => {
            const containerDiv = document.createElement('div');
            containerDiv.className = 'multiselect-container';
            containerDiv.id = `container-custom-${colName}`;
            
            const label = document.createElement('span');
            label.className = 'multiselect-label';
            label.textContent = colName;
            
            const btn = document.createElement('button');
            btn.className = 'multiselect-btn';
            btn.id = `btn-custom-${colName}`;
            btn.textContent = 'Sélectionner...';
            
            const contentId = `content-custom-${colName}`;
            btn.addEventListener('click', () => toggleDropdown(contentId));
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'multiselect-content';
            contentDiv.id = contentId;

            containerDiv.appendChild(label);
            containerDiv.appendChild(btn);
            containerDiv.appendChild(contentDiv);
            container.appendChild(containerDiv);
        });
    }

    // --- Couplage avec Grist API ---
    grist.ready({
        requiredAccess: 'read table',
        columns: [
            { name: "colLatLng", title: "Latitude, Longitude", type: "Text" },
            { name: "colTitle", title: "Titre Épingle", type: "Text" },
            { name: "colRegion", title: "Colonne Région", type: "Text" },
            { name: "colDept", title: "Colonne Département", type: "Text" }
        ],
        options: {
            displayVariables: { type: "String", title: "Variables cartouche (séparées par des ,)", optional: true },
            filterVariables: { type: "String", title: "Filtres additionnels (séparés par des ,)", optional: true }
        }
    });

    grist.onRecords((records, mappings) => {
        if (!mappings) return; 

        currentConfig = grist.getOptions() || {};
        
        const customFilterNames = parseList(currentConfig.filterVariables);
        const displayVars = parseList(currentConfig.displayVariables);

        mappedRecords = records.map(rec => {
            const obj = {
                colLatLng: rec[mappings.colLatLng] || null,
                colTitle: rec[mappings.colTitle] || null,
                colRegion: rec[mappings.colRegion] || null,
                colDept: rec[mappings.colDept] || null,
                customFields: {}
            };
            customFilterNames.forEach(col => { obj.customFields[col] = rec[col] || null; });
            displayVars.forEach(col => { obj.customFields[col] = rec[col] || null; });
            return obj;
        });

        setupDynamicFilterDOM();
        populateFilters(mappedRecords, null);
    });

    window.addEventListener('DOMContentLoaded', async () => {
        initMap();
        await loadDeptGeoJSON();
        document.getElementById('btn-update').addEventListener('click', updateMap);
    });
</script>
</body>
</html>
